<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LILI'S KITCHEN</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff6e5;font-family:"Courier New",monospace;font-weight:bold;color:#111;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;height:100dvh;max-width:480px;margin:auto;background:#fff6e5;overflow:hidden}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
canvas{image-rendering:pixelated;height:140px;width:auto}
button{font:inherit;color:#111;background:#ffd3df;border:3px solid #111;box-shadow:3px 3px 0 #111;padding:8px 12px;border-radius:0;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
/* menu */
#menu{align-items:center;padding-left:14px;padding-right:14px;background:repeating-linear-gradient(90deg,#fff6e5 0 24px,#fdecd0 24px 48px)}
#menu h1{margin:10px 0 0;font-size:30px;letter-spacing:2px;text-shadow:3px 3px 0 #ffd3df}
#menu h4{margin:2px 0 4px;font-size:12px;color:#8a5a35}
#mc{height:150px}#mc canvas{height:150px}
#list{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:8px}
#list button{display:flex;align-items:center;gap:12px;font-size:16px;text-align:left;padding:7px 12px;background:#fff;}
#list button span{font-size:26px}#list button i{margin-left:auto;font-style:normal;color:#e0507a}
#cnt{margin-top:auto;margin-bottom:12px;background:#ffd3df;border:3px solid #111;padding:6px 14px}
/* game */
#top{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#b98b5e;border-bottom:3px solid #111;color:#fff}
#top button{padding:3px 8px;font-size:12px}#dn{font-size:13px;flex:1;text-align:center}#st{font-size:12px}
#prog{height:8px;background:#6b4a2f}#prog i{display:block;height:100%;width:0;background:#ffd3df;transition:width .3s}
#room{flex:0 0 27%;position:relative;display:flex;align-items:flex-end;gap:8px;padding:6px 10px 0;background:
 linear-gradient(#b98b5e 0 0) 0 62% / 100% 5px no-repeat,
 repeating-linear-gradient(90deg,transparent 0 31px,#efdcb8 31px 32px),#fff0d4}
#room:before{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:#9a6b43;border-top:3px solid #111}
#gc{position:relative;flex:none}
#bubble{position:relative;align-self:center;background:#fff;border:3px solid #111;padding:8px 10px;font-size:14px;flex:1;line-height:1.3;box-shadow:3px 3px 0 #111}
#bubble:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:7px solid #111;border-left:0}
#mat{flex:1;position:relative;margin:0 8px;background:#ffd3df;border:3px solid #111;border-top:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background-image:radial-gradient(#ffc0d1 2px,transparent 2px);background-size:14px 14px}
#tool{width:150px;height:130px;background:#fff;border:3px solid #111;box-shadow:4px 4px 0 #111;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#tool .ti{font-size:62px;line-height:1}#tool .tn{font-size:12px;margin-top:2px}
#cont{min-height:28px;font-size:22px;letter-spacing:2px}
#bar{width:150px;height:12px;border:3px solid #111;background:#fff}#bar i{display:block;height:100%;width:0;background:#ff7fa5;transition:width .25s}
#act{font-size:16px;background:#ffe27a;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.wob{animation:wob .4s}.shk{animation:shk .4s}
@keyframes wob{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
@keyframes shk{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.pop{position:absolute;font-size:34px;left:50%;top:0;pointer-events:none;animation:popin .6s forwards}
@keyframes popin{0%{transform:translate(-50%,-30px) scale(1.4);opacity:1}100%{transform:translate(-50%,60px) scale(.3);opacity:0}}
#tray{flex:0 0 auto;min-height:104px;margin:8px;padding:8px;background:#e8c9a0;border:3px solid #111;box-shadow:3px 3px 0 #111;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center}
.ing{width:66px;height:70px;background:#fff;border:3px solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.ing b{font-size:30px;line-height:1.1}.ing u{text-decoration:none;font-size:10px}
.ing.sel{background:#ffe27a;transform:translateY(-4px)}.ing.used{opacity:.25;pointer-events:none}
#tray p{margin:0;font-size:13px}
.ghost{position:fixed;font-size:46px;transform:translate(-50%,-60%);pointer-events:none;z-index:50}
#toast{position:absolute;left:50%;top:36%;transform:translateX(-50%);background:#ff7fa5;color:#fff;border:3px solid #111;padding:6px 14px;font-size:20px;z-index:20;box-shadow:3px 3px 0 #111}
/* result */
#res{position:absolute;inset:0;z-index:30;background:#fff6e5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;
 background:repeating-linear-gradient(90deg,#fff6e5 0 24px,#fdecd0 24px 48px)}
#res h2{font-size:38px;margin:0;text-shadow:3px 3px 0 #ffd3df}#res h3{font-size:30px;margin:0;color:#e0507a}#res p{margin:2px 0;font-size:15px}
.big{font-size:80px;line-height:1.1}
#rc{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:center;width:160px}
#rc canvas{height:150px;width:auto;transform-origin:50% 100%}
#rc canvas.bow{animation:bow 1.2s forwards}
@keyframes bow{0%{transform:rotate(0)}50%,100%{transform:rotate(38deg) translateX(10px)}}
.tear{position:absolute;font-size:18px;animation:tear 1s infinite}
@keyframes tear{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(40px)}}
.btns{display:flex;gap:12px;margin-top:12px}
</style></head><body>
<div id="app">
 <div id="menu" class="scr">
  <h1>LILI'S KITCHEN</h1><h4>Sun Xiaozai's Mango Cafe</h4>
  <div id="mc"></div>
  <div id="list"></div>
  <div id="cnt"></div>
 </div>
 <div id="game" class="scr" hidden>
  <div id="top"><button id="back">&#9664; MENU</button><span id="dn"></span><span id="st"></span></div>
  <div id="prog"><i></i></div>
  <div id="room"><canvas id="gc" style="height:150px"></canvas><div id="bubble"></div></div>
  <div id="mat"><div id="tool"></div><div id="cont"></div><div id="bar"><i></i></div><button id="act" hidden></button></div>
  <div id="tray"></div>
  <div id="toast" hidden>TRY AGAIN!</div>
 </div>
 <div id="res" hidden><div id="rc"></div><div id="rt"></div><div class="btns"><button id="retry">&#8635; RETRY</button><button id="home">MENU</button></div></div>
</div>

const chefCvs=new Set();
CHEF.onload=()=>chefCvs.forEach(c=>drawChef(c,c._m));
function drawChef(c,m){c._m=m;chefCvs.add(c);c.width=178;c.height=302;const g=c.getContext('2d');g.clearRect(0,0,178,302);
 if(!CHEF.complete)return;g.drawImage(CHEF,0,0);
 if(m==='happy'){g.fillStyle='#f9a3bb';g.fillRect(22,146,12,7);g.fillRect(138,146,12,7)}
 if(m==='sad'){g.fillStyle='#6cc4ff';g.fillRect(37,150,5,16);g.fillRect(122,150,5,16);g.fillRect(37,170,5,5)}}
function mk(m){const c=document.createElement('canvas');drawChef(c,m);return c}
/* ---- state ---- */
let cnt=0,got={},dish,si,st,added,actN,sel=null,busy=false,pool=[];
try{const s=JSON.parse(localStorage.getItem('lili')||'{}');cnt=s.cnt||0;got=s.got||{}}catch(e){}
function save(){try{localStorage.setItem('lili',JSON.stringify({cnt,got}))}catch(e){}}
function showMenu(){$('#res').hidden=true;$('#game').hidden=true;$('#menu').hidden=false;
 $('#mc').innerHTML='';$('#mc').appendChild(mk('happy'));
 $('#list').innerHTML=D.map((d,i)=>`<button data-i="${i}"><span>${d.e}</span>${d.n}<i>${got[d.k]?'✔':''}</i></button>`).join('');
 $('#cnt').textContent='DISHES DONE: '+cnt}
$('#list').onclick=e=>{const b=e.target.closest('button');if(b)start(+b.dataset.i)};
$('#back').onclick=showMenu;$('#home').onclick=showMenu;
$('#retry').onclick=()=>{$('#res').hidden=true;start(D.indexOf(dish))};
function start(i){dish=D[i];si=0;busy=false;$('#menu').hidden=true;$('#res').hidden=true;$('#game').hidden=false;$('#dn').textContent=dish.n;load()}
function mood(m,ms){drawChef($('#gc'),m);if(ms)setTimeout(()=>drawChef($('#gc'),'normal'),ms)}
function load(){st=dish.s[si];added=[];actN=0;sel=null;busy=false;
 pool=st.pl.slice().sort(()=>Math.random()-.5);
 $('#st').textContent='STEP '+(si+1)+'/'+dish.s.length;
 $('#prog i').style.width=(si/dish.s.length*100)+'%';
 $('#tool').innerHTML=`<div class="ti">${st.i}</div><div class="tn">${st.t}</div>`;
 $('#cont').textContent='';
 $('#tray').innerHTML=pool.length?pool.map(k=>`<div class="ing" data-k="${k}"><b>${I[k]}</b><u>${k}</u></div>`).join(''):'<p>TAP THE BUTTON!</p>';
 mood('normal');hint();refresh()}
function hint(){$('#bubble').textContent=st.h+(st.o?'  NEXT: '+st.nd[added.length]:'')}
function refresh(){const tot=st.nd.length+(st.a?st.n:0),cur=added.length+actN;
 $('#bar i').style.width=(tot?cur/tot*100:0)+'%';
 const need=added.length>=st.nd.length;
 const a=$('#act');
 if(st.a&&need){a.hidden=false;a.textContent=st.a+' '+actN+'/'+st.n}else a.hidden=true;
 $('#tray').querySelectorAll('.ing').forEach(el=>{el.classList.toggle('used',added.includes(el.dataset.k));el.classList.toggle('sel',el.dataset.k===sel)})}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function toast(){const t=$('#toast');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,800)}
function drop(k){if(busy)return;sel=null;
 const ok=st.nd.includes(k)&&!added.includes(k)&&(!st.o||st.nd[added.length]===k);
 if(!ok){toast();anim($('#tool'),'shk');mood('sad',700);refresh();return}
 added.push(k);$('#cont').textContent+=I[k]+' ';
 const p=document.createElement('div');p.className='pop';p.textContent=I[k];$('#tool').appendChild(p);setTimeout(()=>p.remove(),650);
 anim($('#tool'),'wob');mood('happy',600);hint();refresh();
 if(added.length>=st.nd.length&&!st.a)next()}
function next(){busy=true;setTimeout(()=>{si++;si>=dish.s.length?finish():load()},700)}
$('#act').onclick=()=>{if(busy)return;actN++;anim($('#tool'),'wob');mood('happy',400);refresh();if(actN>=st.n){$('#act').hidden=true;next()}};
$('#tool').onclick=()=>{if(sel)drop(sel)};
$('#mat').onclick=e=>{if(sel&&e.target.id!=='act')drop(sel)};
/* tray: tap-select or drag */
$('#tray').addEventListener('pointerdown',e=>{const it=e.target.closest('.ing');if(!it||it.classList.contains('used')||busy)return;
 e.preventDefault();const k=it.dataset.k;sel=sel===k?null:k;refresh();
 const sx=e.clientX,sy=e.clientY;let g=null;
 const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){g=document.createElement('div');g.className='ghost';g.textContent=I[k];document.body.appendChild(g);sel=k;refresh()}
  if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  if(g){g.remove();const r=$('#mat').getBoundingClientRect();
   if(ev.type==='pointerup'&&ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top-30&&ev.clientY<r.bottom)drop(k);else{sel=null;refresh()}}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)});
/* result: 20% fail, real random */
function finish(){const ok=Math.random()>=0.2;
 if(ok){cnt++;got[dish.k]=1;save()}
 $('#prog i').style.width='100%';
 const c=mk(ok?'happy':'sad');const box=$('#rc');box.innerHTML='';
 if(!ok){c.className='bow';setTimeout(()=>{box.insertAdjacentHTML('beforeend','<span class="tear" style="left:52px;top:84px">💧</span><span class="tear" style="left:94px;top:84px;animation-delay:.4s">💧</span>')},900)}
 box.appendChild(c);
 $('#rt').innerHTML=ok?`<div class="big">${dish.e}</div><h2>YUMMY!</h2><p>好吃！${dish.n} DONE ✨</p><p>DISHES DONE: ${cnt}</p>`
  :`<div class="big"><span style="filter:grayscale(1)">${dish.e}</span>💨</div><h2>SORRY…</h2><h3>对不起……</h3><p>对不起……我下次会努力的！</p>`;
 $('#res').hidden=false}
showMenu();
</script></body></html>
